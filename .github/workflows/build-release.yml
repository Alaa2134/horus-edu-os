name: Build & Release Horus Edu OS ISO

on:
  push:
    tags:
      - 'v*'
  # Build (but don't release) on PRs that touch build-relevant files, so the
  # ISO is verified end-to-end before merge. The release step stays tag-gated.
  pull_request:
    branches: [ master ]
    paths:
      - 'scripts/**'
      - 'apps/**'
      - 'configs/**'
      - 'branding/**'
      - 'templates/**'
      - '.github/workflows/build-release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

# A new push to the same ref cancels an in-progress build (no wasted parallel
# ISO builds). Tag builds keep their own group so releases aren't cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build ISO on Ubuntu 22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space (aggressive)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Show disk space
        run: df -h

      - name: Set version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${{ github.event.inputs.version || '1.0.0' }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "ISO_NAME=horus-edu-os-${VERSION}-amd64.iso" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            debootstrap squashfs-tools xorriso isolinux \
            grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
            syslinux-utils wget curl git python3-pip \
            software-properties-common apt-utils

      - name: Build ISO
        run: |
          sudo bash scripts/build-iso.sh --arch amd64
          sudo chown -R "$USER:$USER" dist/
        env:
          DEBIAN_FRONTEND: noninteractive
          CI: true

      - name: List build output
        if: always()
        run: |
          echo "=== dist/ ===" && ls -lh dist/ 2>/dev/null || echo "dist/ is empty"
          echo "=== disk ===" && df -h

      - name: Rename ISO to versioned name
        run: |
          mkdir -p dist
          ISO_SRC=$(ls dist/horus-os-*.iso 2>/dev/null | head -1)
          if [[ -z "$ISO_SRC" ]]; then
            echo "ERROR: No ISO found in dist/"
            exit 1
          fi
          mv "$ISO_SRC" "dist/${{ env.ISO_NAME }}"
          ls -lh dist/

      - name: Generate SHA256
        run: |
          cd dist
          sha256sum "${{ env.ISO_NAME }}" > sha256sum.txt
          cat sha256sum.txt

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: horus-edu-os-iso
          path: |
            dist/${{ env.ISO_NAME }}
            dist/sha256sum.txt
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: "Horus Edu OS v${{ steps.version.outputs.version }}"
          body: |
            ## 🏛 Horus Edu OS v${{ steps.version.outputs.version }}

            نظام التشغيل التعليمي الرسمي لجامعة حورس — **التعلم بلا حدود**

            ### التحميل
            | الملف | الوصف |
            |-------|-------|
            | `${{ env.ISO_NAME }}` | ملف ISO الكامل (~2-3 GB) |
            | `sha256sum.txt` | للتحقق من سلامة الملف |

            ### التثبيت السريع
            **VMware/VirtualBox:** حمّل ISO وافتحه مباشرة
            **USB:** استخدم Rufus (Windows) أو `dd` (Linux)

            ```bash
            sha256sum -c sha256sum.txt
            sudo dd if=${{ env.ISO_NAME }} of=/dev/sdX bs=4M status=progress
            ```

            ### بيانات الدخول
            - Username: `horus-user`
            - Password: `horus2024`

            ### المتطلبات
            - RAM: 4 GB+ · Storage: 30 GB+ · Architecture: x86_64
          files: |
            dist/${{ env.ISO_NAME }}
            dist/sha256sum.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke-test-boot:
    name: Smoke test — boot the ISO in QEMU
    needs: build-iso
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: horus-edu-os-iso
          path: iso

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-x86 qemu-utils

      - name: Extract kernel and initrd from the ISO
        run: |
          set -x
          ls -R iso || true
          ISO=$(find iso -name '*.iso' | head -1)
          if [ -z "$ISO" ]; then echo "::error::No ISO found in artifact"; exit 1; fi
          echo "ISO=$ISO" >> "$GITHUB_ENV"
          echo "Testing: $ISO ($(du -h "$ISO" | cut -f1))"
          mkdir -p mnt
          sudo mount -o loop,ro "$ISO" mnt
          echo "--- casper dir ---"; ls -lhR mnt/casper 2>/dev/null || ls -lhR mnt 2>/dev/null | head -40 || true
          # Filenames may differ in case; find them robustly.
          KER=$(find mnt -iname 'vmlinuz*' | head -1)
          INI=$(find mnt -iname 'initrd*'  | head -1)
          echo "kernel=$KER  initrd=$INI"
          cp "$KER" vmlinuz
          cp "$INI" initrd
          sudo umount mnt
          ls -lh vmlinuz initrd

      - name: Boot headless in QEMU and capture serial console
        run: |
          set +e   # this is a polling loop; don't let a false test abort the step
          # No KVM on the runner → TCG emulation. We verify the ISO's boot chain
          # actually starts: kernel boots and the initramfs/casper stage runs.
          # (Reaching full GNOME under pure emulation is impractical; a real VM
          #  with KVM is the place to verify the desktop — see vm/run-qemu.sh.)
          qemu-system-x86_64 \
            -m 4096 -smp 2 -no-reboot \
            -kernel vmlinuz -initrd initrd \
            -append "boot=casper console=ttyS0,115200" \
            -cdrom "$ISO" \
            -display none -serial file:boot.log -monitor none 2>qemu.err &
          QPID=$!

          BOOT_RE="Linux version|Booting|initramfs|Begin: Running|casper|Freeing|systemd\[1\]:|Reached target|login:|HORUS"
          FULL_RE="systemd\[1\]:|Reached target|login:"
          boot=0; full=0
          for i in $(seq 1 90); do
            sleep 8
            if grep -Eaq "$BOOT_RE" boot.log 2>/dev/null; then boot=1; fi
            if grep -Eaq "$FULL_RE" boot.log 2>/dev/null; then full=1; break; fi
            if ! kill -0 "$QPID" 2>/dev/null; then echo "QEMU process exited"; break; fi
            if [ "$boot" -eq 1 ] && [ "$i" -ge 45 ]; then break; fi
          done
          kill "$QPID" 2>/dev/null

          echo "================ qemu stderr ================"
          cat qemu.err 2>/dev/null || true
          echo "================ boot.log (last 120 lines) ================"
          tail -120 boot.log 2>/dev/null || echo "(no serial output captured)"
          echo "==========================================================="
          echo "boot=$boot full=$full" > result.env
          if [ "$full" -eq 1 ]; then
            echo "✅ PASSED — kernel + initramfs booted and reached systemd userspace."
          elif [ "$boot" -eq 1 ]; then
            echo "✅ PASSED — kernel + initramfs boot chain verified."
            echo "ℹ️  Did not reach systemd under emulation (expected without KVM);"
            echo "    verify the full desktop in a KVM VM via vm/run-qemu.sh."
          else
            echo "::error::Boot FAILED — no kernel/initramfs output captured."
            exit 1
          fi

      - name: Report diagnostics to the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tail = (f, n=2500) => { try { return fs.readFileSync(f,'utf8').slice(-n); } catch(e){ return '(file not produced)'; } };
            const body = [
              '### 🧪 Boot smoke-test diagnostics',
              `Job result: **${{ job.status }}**`,
              '',
              '<details><summary>qemu stderr</summary>',
              '', '```', tail('qemu.err'), '```', '</details>',
              '',
              '<details><summary>boot.log (tail)</summary>',
              '', '```', tail('boot.log'), '```', '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body
            });

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-log
          path: |
            boot.log
            qemu.err
          retention-days: 14
