name: Build & Release Horus Edu OS ISO

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

jobs:
  build-iso:
    name: Build ISO on Ubuntu 22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space (aggressive)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Show disk space
        run: df -h

      - name: Set version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${{ github.event.inputs.version || '1.0.0' }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "ISO_NAME=horus-edu-os-${VERSION}-amd64.iso" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            debootstrap squashfs-tools xorriso isolinux \
            grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
            syslinux-utils wget curl git python3-pip \
            software-properties-common apt-utils

      - name: Build ISO
        run: |
          sudo bash scripts/build-iso.sh --arch amd64
        env:
          DEBIAN_FRONTEND: noninteractive
          CI: true

      - name: List build output
        if: always()
        run: |
          echo "=== dist/ ===" && ls -lh dist/ 2>/dev/null || echo "dist/ is empty"
          echo "=== disk ===" && df -h

      - name: Rename ISO to versioned name
        run: |
          mkdir -p dist
          ISO_SRC=$(ls dist/horus-os-*.iso 2>/dev/null | head -1)
          if [[ -z "$ISO_SRC" ]]; then
            echo "ERROR: No ISO found in dist/"
            exit 1
          fi
          mv "$ISO_SRC" "dist/${{ env.ISO_NAME }}"
          ls -lh dist/

      - name: Generate SHA256
        run: |
          cd dist
          sha256sum "${{ env.ISO_NAME }}" > sha256sum.txt
          cat sha256sum.txt

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: horus-edu-os-iso
          path: |
            dist/${{ env.ISO_NAME }}
            dist/sha256sum.txt
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: "Horus Edu OS v${{ steps.version.outputs.version }}"
          body: |
            ## 🏛 Horus Edu OS v${{ steps.version.outputs.version }}

            نظام التشغيل التعليمي الرسمي لجامعة حورس — **التعلم بلا حدود**

            ### التحميل
            | الملف | الوصف |
            |-------|-------|
            | `${{ env.ISO_NAME }}` | ملف ISO الكامل (~2-3 GB) |
            | `sha256sum.txt` | للتحقق من سلامة الملف |

            ### التثبيت السريع
            **VMware/VirtualBox:** حمّل ISO وافتحه مباشرة
            **USB:** استخدم Rufus (Windows) أو `dd` (Linux)

            ```bash
            sha256sum -c sha256sum.txt
            sudo dd if=${{ env.ISO_NAME }} of=/dev/sdX bs=4M status=progress
            ```

            ### بيانات الدخول
            - Username: `horus-student`
            - Password: `horus2024`

            ### المتطلبات
            - RAM: 4 GB+ · Storage: 30 GB+ · Architecture: x86_64
          files: |
            dist/${{ env.ISO_NAME }}
            dist/sha256sum.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
