<?xml version="1.0" encoding="UTF-8"?>
<!--
  HORUS OS — Default Desktop Wallpaper
  "Pyramids at Dusk" — Eye of Horus over the Giza skyline
  Created by Alaa Saber · v1.0.0
  Pure vector (1920x1080 viewBox) — scales crisply to any resolution.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Dusk sky: deep night blue at top fading to a warm gold horizon -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#070b1c"/>
      <stop offset="28%" stop-color="#0d1a3a"/>
      <stop offset="55%" stop-color="#1d3157"/>
      <stop offset="74%" stop-color="#7b4a3a"/>
      <stop offset="88%" stop-color="#cf7b34"/>
      <stop offset="100%" stop-color="#f2a64a"/>
    </linearGradient>

    <!-- Sun glow near the horizon -->
    <radialGradient id="sun" cx="50%" cy="100%" r="55%">
      <stop offset="0%"  stop-color="#ffd98a" stop-opacity="0.95"/>
      <stop offset="22%" stop-color="#f7b85a" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#d97a32" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d97a32" stop-opacity="0"/>
    </radialGradient>

    <!-- Foreground ground gradient -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1a0f0a"/>
      <stop offset="100%" stop-color="#070506"/>
    </linearGradient>

    <!-- Gold gradient for the Eye + wordmark -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#ffe9b8"/>
      <stop offset="45%" stop-color="#f3d28a"/>
      <stop offset="100%" stop-color="#d8a94e"/>
    </linearGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f7b85a" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#ffd98a" stop-opacity="0.85"/>
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softblur"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- Stars (upper sky) -->
  <g fill="#ffffff">
    <circle cx="180"  cy="90"  r="1.4" opacity="0.8"/>
    <circle cx="320"  cy="160" r="1.0" opacity="0.5"/>
    <circle cx="520"  cy="70"  r="1.6" opacity="0.9"/>
    <circle cx="700"  cy="140" r="1.0" opacity="0.4"/>
    <circle cx="980"  cy="60"  r="1.3" opacity="0.7"/>
    <circle cx="1180" cy="120" r="1.1" opacity="0.6"/>
    <circle cx="1400" cy="80"  r="1.6" opacity="0.85"/>
    <circle cx="1600" cy="150" r="1.0" opacity="0.45"/>
    <circle cx="1760" cy="90"  r="1.3" opacity="0.7"/>
    <circle cx="240"  cy="240" r="1.0" opacity="0.4"/>
    <circle cx="860"  cy="210" r="1.0" opacity="0.45"/>
    <circle cx="1500" cy="240" r="1.0" opacity="0.4"/>
  </g>

  <!-- Sun glow at the horizon -->
  <rect width="1920" height="1080" fill="url(#sun)"/>

  <!-- Distant pyramids (hazy, behind) -->
  <g opacity="0.45" filter="url(#softblur)">
    <polygon points="350,748 560,520 770,748" fill="#243a5e"/>
    <polygon points="1180,748 1360,560 1540,748" fill="#243a5e"/>
  </g>

  <!-- Great Pyramid (main, right of center) -->
  <polygon points="980,760 1320,300 1660,760" fill="#0d0a0c"/>
  <!-- lit edge -->
  <polygon points="1320,300 1660,760 1560,760" fill="url(#rim)" opacity="0.5"/>
  <!-- subtle face shading -->
  <polygon points="980,760 1320,300 1320,760" fill="#000000" opacity="0.28"/>

  <!-- Second pyramid (left, overlapping) -->
  <polygon points="560,760 820,380 1080,760" fill="#0a070a"/>
  <polygon points="820,380 1080,760 1010,760" fill="url(#rim)" opacity="0.35"/>
  <polygon points="560,760 820,380 820,760" fill="#000000" opacity="0.3"/>

  <!-- Ground / desert foreground -->
  <rect x="0" y="755" width="1920" height="325" fill="url(#ground)"/>
  <rect x="0" y="755" width="1920" height="3" fill="#f2a64a" opacity="0.25"/>

  <!-- ── Eye of Horus (centered, line-art, glowing gold) ── -->
  <g transform="translate(960,420)" filter="url(#glow)" fill="none"
     stroke="url(#gold)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <!-- upper brow -->
    <path d="M -210,-70 C -120,-150 120,-150 210,-58"/>
    <!-- eye lower lid -->
    <path d="M -205,-44 C -110,40 110,40 205,-58"/>
    <!-- inner eye / pupil -->
    <circle cx="0" cy="-18" r="40" stroke-width="10"/>
    <circle cx="0" cy="-18" r="13" fill="url(#gold)" stroke="none"/>
    <!-- corner mark (left) -->
    <path d="M -205,-44 C -245,-30 -262,2 -250,34"/>
    <!-- teardrop vertical -->
    <path d="M 36,30 C 30,90 26,120 26,150"/>
    <!-- curl base -->
    <path d="M 120,16 C 150,70 120,140 60,150 C 96,120 96,70 70,40"/>
  </g>

  <!-- ── Wordmark ── -->
  <text x="960" y="640" text-anchor="middle"
        font-family="Cinzel, Georgia, 'Times New Roman', serif"
        font-size="92" font-weight="700" letter-spacing="26"
        fill="url(#gold)" filter="url(#glow)">HORUS OS</text>

  <text x="960" y="690" text-anchor="middle"
        font-family="'JetBrains Mono', monospace"
        font-size="20" letter-spacing="13" fill="#ffe9b8" opacity="0.7">INTELLIGENCE  AWAKENED</text>

  <text x="960" y="724" text-anchor="middle"
        font-family="'Noto Naskh Arabic', serif"
        font-size="24" fill="#f3d28a" opacity="0.6">نظام حورس — ذكاء مدمج للمستقبل</text>
</svg>
