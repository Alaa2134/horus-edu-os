[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data: https://images.unsplash.com https://*.unsplash.com; connect-src 'self' http://127.0.0.1:8420 http://127.0.0.1:8421 http://127.0.0.1:8422;"

[[redirects]]
  from   = "/download"
  to     = "/#download"
  status = 301

[[redirects]]
  from   = "/apps"
  to     = "/#apps"
  status = 301

[[redirects]]
  from   = "/docs"
  to     = "/#download"
  status = 301

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
