[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; img-src 'self' data:;"

[[redirects]]
  from   = "/download"
  to     = "/#download"
  status = 301

[[redirects]]
  from   = "/apps"
  to     = "/#apps"
  status = 301

[[redirects]]
  from   = "/docs"
  to     = "/#download"
  status = 301
