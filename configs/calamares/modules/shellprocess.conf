# Post-install hardening: drop the live conveniences and lock things down.
---
dontChroot: false
timeout: 60
script:
  - command: "sed -i 's/^AutomaticLoginEnable=true/AutomaticLoginEnable=false/' /etc/gdm3/custom.conf"
    timeout: 10
  - command: "rm -f /etc/sudoers.d/horus-user"
    timeout: 10
  - command: "ufw --force enable"
    timeout: 20
