# HORUS OS — Calamares installer sequence
# Deployed to /etc/calamares/settings.conf. Launched from the live desktop via
# the "Install HORUS OS" launcher. NOTE: needs verification in a real ISO build.
---
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules ]

instances:
- id:       horus
  module:   shellprocess
  config:   shellprocess.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - grubcfg
  - bootloader
  - packages
  - removeuser
  - shellprocess@horus
  - umount
- show:
  - finished

branding: horus

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
