<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HORUS Web Starter</title>
<style>
  :root{--gold:#c9a227;--cyan:#00d4ff;--bg:#0a0a0f;--text:#e8e8f0}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);
    min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
  h1{font-size:clamp(28px,6vw,56px);background:linear-gradient(135deg,#c9a227,#f5d060,#00d4ff);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  p{color:#aaaacc;margin:14px 0 24px}
  button{background:linear-gradient(135deg,#c9a227,#a07820);color:#0a0a0f;border:none;
    padding:12px 24px;border-radius:9999px;font-weight:700;cursor:pointer;font-size:16px}
  #count{display:block;margin-top:18px;color:var(--cyan);font-size:20px}
</style>
</head>
<body>
  <div>
    <h1>HORUS Web Starter</h1>
    <p>A clean, zero-dependency web project. Edit <code>index.html</code> and refresh.</p>
    <button onclick="document.getElementById('count').textContent='Clicks: '+(++c)">Click me</button>
    <span id="count">Clicks: 0</span>
  </div>
  <script>let c=0;</script>
</body>
</html>
